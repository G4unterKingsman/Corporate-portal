server:
  port: 8080


spring:
  thymeleaf:
    check-template: true

  application:
    name: CorporatePortalApplication

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  datasource:
    url: jdbc:h2:mem:cor-portal
    username: sa
    password: sa
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

info:
  app:
    name: CorporatePortalApplication
    description: app for company management
    version: 1.0

management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    env:
      enabled: true